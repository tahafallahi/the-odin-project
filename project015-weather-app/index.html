<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="/src/styles.css" />
    <script type="module" src="/src/main.js" defer></script>
  </head>
  <body>
    <div id="content">
      <form id="search-bar-form">
        <input type="search" id="search-bar" name="searchBar" />
        <button type="submit" id="search-bar-submit">Search</button>
      </form>
      <h1 id="user-location">Your Location</h1>
      <img id="weather-icon" />
      <div id="temperatures">
        <h3>Temperature: <span class="temp"></span></h3>
        <div>
          <p>Max Temp: <span class="min-temp"></span></p>
          <p>Max Temp: <span class="max-temp"></span></p>
        </div>
      </div>
      <p id="weather-description"></p>
    </div>
  </body>
</html>
