<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crimson Ark</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <div id="picture-section">
        <img id="hero-picture" src="pictures/Crimson Arc Concept 4.2 for Sign up page.jpg">
        <img id="logo" src="pictures/Crimson Arc Logo.png">
    </div>
    <div id="content-section">
        <h1 id="title">Crimson ARK</h1>
        <p id="descreption">Crimson Ark is a no human blood community. We promise a full recovery, offer guidance from senior clean vampires to help you get clean and live a life free from human blood.</p>
        <form class="form" action="" method="post"> 
            <div class="form-name form-element">
                <label for="name">First Name</label>
                <input id="name" type="text" name="name" placeholder="Tepes">
            </div>
            <div class="form-surname form-element">
                <label for="surname">Surname</label>
                <input id="surname" autocorrect="on" type="text" name="surname" placeholder="Dracula">
            </div>
            <div class="form-email form-element">
                <label for="email">Email *</label>
                <input id="email" type="email" name="email" placeholder="vladmirtepes@bloodmail.com" required>
            </div>
            <div class="form-blood-type form-element">
                <label for="blood-type">Blood Type</label>
                <select id="blood-type" type="text" name="bloodType">
                    <option>Choose your blood type.</option>
                    <option>A+</option>
                    <option>A-</option>
                    <option>AB+</option>
                    <option>AB-</option>
                    <option>B+</option>
                    <option>B-</option>
                    <option>O+</option>
                    <option>O-</option>
                </select>
            </div>
            <div class="form-password form-element">
                <label for="password">Password *</label>
                <input id="password" type="password" name="password" placeholder="NOT! 1234" required>
            </div>
            <div class="form-password form-element">
                <label for="password">Confrim Password *</label>
                <input id="password" type="password"  name="password" placeholder="NOT! 1234" required>
            </div>
            <button type="submit">Join now!</button>
        </form>
        <p></p>
    </div>
</body>
</html>
